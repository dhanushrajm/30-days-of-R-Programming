name: Auto-Update Dashboard

# 1. When should this script run?
on:
  schedule:
    - cron: "0 * * * *" 
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest 
    
    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2

      - name: Setup Pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Install R Packages
        run: |
          install.packages(c("tidyverse", "flexdashboard", "plotly", "sf", "rmarkdown"))
        shell: Rscript {0}

      - name: Render Dashboard
        run: |
          rmarkdown::render("Day-25-of-R-programming.md", output_file = "index.html")
        shell: Rscript {0}

      - name: Commit and Push Changes
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions Automation"
          git add index.html
          git commit -m "Automated data refresh" || echo "No new data to commit"
          git push
